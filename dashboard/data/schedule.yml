# WBS のタスク（ガントチャートに出る）
#   担当者が決まっていないため、空にしている。決まったら PR で追加する。
#   milestone: GitHub のマイルストーンの名前と同じにする。start・end: YYYY-MM-DD。
#   assignee: GitHub の ID（project.json のメンバーから選ぶ。必須）。
#   issue: 紐づく Issue の番号（任意）。Issue が完了していれば、画面では「完了」になる。
#   status: todo | doing | done（Issue がないときの状態）。depends_on: 先に必要なタスクの id（任意）。
tasks: []
