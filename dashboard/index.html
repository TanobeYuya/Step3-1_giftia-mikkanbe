<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>進捗ダッシュボード</title>
  <script>
    /* 保存済みの表示モード（ライト / ダーク）を、描画の前に反映する。保存が無ければシステム設定に従う */
    try { var t = localStorage.getItem("dashboard-theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) { /* 保存領域が使えなくても表示できる */ }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="banner" class="banner" hidden></div>
  <header class="top wrap" id="top"></header>
  <nav class="nav" id="nav" aria-label="ページ内の移動"><div class="wrap"><ul id="nav-list"></ul></div></nav>
  <main class="wrap" id="app">
    <section id="summary" aria-label="サマリー"></section>
    <section id="attention" aria-labelledby="h-attention"></section>
    <section id="schedule" aria-labelledby="h-schedule"></section>
    <section id="gantt" aria-labelledby="h-gantt"></section>
    <section id="progress" aria-labelledby="h-progress"></section>
    <section id="work" aria-labelledby="h-work"></section>
    <section id="members" aria-labelledby="h-members"></section>
    <section id="links" aria-labelledby="h-links"></section>
  </main>
  <footer class="wrap" id="footer"></footer>
  <noscript><p class="wrap">このページの表示には JavaScript が必要です。</p></noscript>
  <script src="app.js"></script>
</body>
</html>
